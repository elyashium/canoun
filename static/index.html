<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluator.ai — Handwritten Answer Sheet Evaluator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #FFFFFF;
            --text-primary: #111111;
            --accent: #111111;
            --border: #E5E5E5;
            --card-bg: #FFFFFF;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, .font-display {
            font-family: 'Playfair Display', serif;
        }

        .pill-button {
            background: var(--accent);
            color: var(--bg-primary);
            border-radius: 100px;
            padding: 12px 24px;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .pill-button.light {
            background: #F4F4F5;
            color: var(--text-primary);
        }

        .pill-button:hover {
            opacity: 0.85;
        }

        /* Upload Zone */
        .upload-zone {
            border: 2px dashed var(--border);
            transition: all 0.3s ease;
        }
        .upload-zone:hover, .upload-zone.drag-over {
            border-color: var(--accent);
            background-color: #FAFAFA;
        }
        .result-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            transition: all 0.2s ease;
        }
        .result-card:hover {
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
        }
        .confidence-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .confidence-green { background: #DCFCE7; color: #166534; }
        .confidence-yellow { background: #FEF9C3; color: #854D0E; }
        .confidence-red { background: #FEE2E2; color: #991B1B; }
        .loading-spinner {
            width: 40px; height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .score-ring {
            width: 64px; height: 64px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 16px;
            border: 3px solid var(--border);
        }
        .progress-bar {
            height: 4px; background: var(--border); border-radius: 2px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; border-radius: 2px; transition: width 0.6s ease;
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- Navbar - Logo only -->
    <nav class="w-full bg-white">
        <div class="max-w-[1400px] mx-auto px-6 h-[72px] flex items-center">
            <div class="flex items-center gap-2">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2v20M2 12h20M19.07 4.93l-14.14 14.14M4.93 4.93l14.14 14.14"/>
                </svg>
                <span class="text-xl tracking-tight text-gray-900 ml-1">Evaluator.ai</span>
            </div>
        </div>
    </nav>

    <!-- Hero Image Area -->
    <div class="w-full max-w-[1400px] mx-auto px-4 mb-16">
        <!-- Placeholder for the large pixel art image -->
        <div class="w-full h-[400px] md:h-[500px] bg-gray-100 object-cover w-full overflow-hidden flex items-center justify-center relative">
            <img src="./hero.png" class="w-full h-full object-cover" alt="Classical archway mosaic">
        </div>
    </div>

    <!-- Main Hero Text Section -->
    <main class="max-w-[1400px] mx-auto px-6 pb-20">
        <div class="flex flex-col md:flex-row justify-between items-start mb-24 gap-12">
            <!-- Left Side Huge Text -->
            <div class="md:w-[55%]">
                <h1 class="text-[56px] md:text-[68px] font-display tracking-tight leading-[1.05] text-gray-900">
                    AI agent that grades all your handwritten exams
                </h1>
            </div>
            
            <!-- Right Side Smaller Text and Buttons -->
            <div class="md:w-[35%] flex flex-col pt-4">
                <p class="text-gray-600 mb-8 text-[16px] leading-relaxed">
                    AI evaluator for handwritten exams.
                </p>
                <div class="flex items-center gap-4">
                    <button class="pill-button" onclick="document.getElementById('uploadZone').scrollIntoView({behavior: 'smooth'})">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                        </svg>
                        Install now
                    </button>
                    <button class="pill-button light" onclick="document.getElementById('uploadZone').scrollIntoView({behavior: 'smooth'})">
                        Try for free
                    </button>
                </div>
            </div>
        </div>



        <!-- Upload Zone (Interactive part for the demo) -->
        <div class="max-w-4xl mx-auto">
            <h2 class="text-3xl font-display font-medium mb-8 text-center">Try the Live Demo</h2>
            
            <!-- Upload Zone -->
            <div id="uploadZone" class="upload-zone rounded-2xl p-12 cursor-pointer mb-8">
                <div id="uploadContent" class="text-center">
                    <div class="flex justify-center mb-4">
                        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" class="text-gray-300">
                            <rect x="6" y="10" width="36" height="28" rx="4" stroke="currentColor" stroke-width="2"/>
                            <path d="M24 20V32M24 20L19 25M24 20L29 25" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <p class="text-base font-medium text-gray-600 mb-1">Drop answer sheets here</p>
                    <p class="text-sm text-gray-400">PNG, JPG, or WebP • Max 10MB per file</p>
                </div>
                <div id="loadingState" class="hidden text-center">
                    <div class="flex justify-center mb-4">
                        <div class="loading-spinner"></div>
                    </div>
                    <p class="text-base font-medium text-gray-600 mb-1">Evaluating answers...</p>
                    <p class="text-sm text-gray-400" id="loadingStatus">Extracting handwritten text</p>
                </div>
            </div>

            <input type="file" id="fileInput" multiple accept="image/*" class="hidden">

            <!-- File List Preview -->
            <div id="fileList" class="mb-6 hidden">
                <div id="fileListItems" class="space-y-2"></div>
                <div class="text-center mt-6">
                    <button id="evaluateBtn" onclick="submitFiles()" class="pill-button">
                        Evaluate Sheets
                    </button>
                </div>
            </div>
        </div>

        <!-- Results Section -->
        <div id="resultsSection" class="max-w-4xl mx-auto mt-16 hidden">
            <div class="flex items-center justify-between mb-8">
                <h2 class="text-3xl font-display font-semibold">Results</h2>
                <div id="overallScore" class="text-right">
                    <!-- Populated by JS -->
                </div>
            </div>
            <div id="resultsContainer" class="space-y-6">
                <!-- Result cards injected here -->
            </div>
            <div id="exportAction" class="text-center mt-12 hidden">
                <button onclick="downloadCSV()" class="pill-button light px-8 py-3 flex items-center gap-2 mx-auto" style="border: 1px solid #e5e7eb; border-radius: 9999px; background: white;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    Download CSV Report
                </button>
            </div>
        </div>
    </main>



    <script src="./app.js"></script>
</body>
</html>
